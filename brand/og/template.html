<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- 1200×630 Open Graph template. Params: ?title=&subtitle=&kicker=
     Uses brand/tokens.json colours (dark theme). Rendered by brand/render_assets.py. -->
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; }
  body {
    background: #0a0a0a; color: #fafafa; box-sizing: border-box; padding: 72px 80px;
    font-family: 'Geist', ui-sans-serif, system-ui, sans-serif;
    display: flex; flex-direction: column; justify-content: space-between;
    background-image: radial-gradient(circle at 88% 12%, rgba(103,170,237,0.18), transparent 42%);
  }
  .kicker { font-size: 26px; color: #a1a1a1; letter-spacing: 0.01em; }
  h1 { font-size: 84px; line-height: 1.02; letter-spacing: -0.035em; font-weight: 600; margin: 0 0 22px; }
  .sub { font-size: 34px; line-height: 1.3; color: #d4d4d4; max-width: 980px; }
  .foot { display: flex; align-items: center; justify-content: space-between; }
  .foot img { width: 72px; height: 72px; }
  .bar { height: 6px; width: 120px; background: #67aaed; border-radius: 3px; }
</style>
</head>
<body>
  <div class="kicker" id="kicker"></div>
  <div>
    <h1 id="title"></h1>
    <div class="sub" id="subtitle"></div>
  </div>
  <div class="foot">
    <div class="bar"></div>
    <img src="../assets/monogram.svg" alt="">
  </div>
  <script>
    const q = new URLSearchParams(location.search);
    for (const k of ['title', 'subtitle', 'kicker']) document.getElementById(k).textContent = q.get(k) || '';
  </script>
</body>
</html>
